 if(st!=='menu'){for(let k=0;k<30;k++){const z=k*6-(dist%6);if(z<-3)continue;const p1=proj(0,z),p2=proj(0,z+2.5);ctx.strokeStyle='#fff';ctx.lineWidth=4*p1.s;ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);ctx.stroke()}}
 if(st==='menu'){drawMenu();return}
 // collect drawables far->near
 const items=[];
 for(const o of objs){const rz=o.z-dist;if(rz<-3||rz>FAR)continue;items.push({z:rz,o})}
 const bz=dogZ-dist;if(!surv&&bz<FAR)items.push({z:bz,boss:true});for(const q of parts){const rz=q.z-dist;if(rz>-3&&rz<FAR)items.push({z:rz,part:q})}
 items.sort((p,q)=>q.z-p.z);
 for(const it of items){const z=it.z;
  if(it.boss){drawDog(z);continue}
  if(it.part){drawPart(it.part,z);continue}
  const o=it.o;
  if(o.t==='g'){for(let s=0;s<2;s++){const x0=s?0.03:-0.97,x1=s?0.97:-0.03;const p0=proj(x0,z),p1=proj(x1,z);const h=W*.32*p0.s;const good=o.ops[s][0]==='+'||o.ops[s][0]==='x';
    ctx.globalAlpha=o.used&&o.pick!==s?.25:.75;ctx.fillStyle=good?'#2ecc40':'#ff4136';ctx.fillRect(p0.x,p0.y-h,p1.x-p0.x,h);ctx.globalAlpha=1;
    ctx.strokeStyle='#fff';ctx.lineWidth=3*p0.s;ctx.strokeRect(p0.x,p0.y-h,p1.x-p0.x,h);
    text(o.ops[s].replace('x','×').replace('/','÷'),(p0.x+p1.x)/2,p0.y-h/2,Math.max(10,38*p0.s),'#fff')}}
  else if(o.t==='m'){if(o.n>0)drawMice(o,z)}
  else if(o.t==='c'){if(o.hp>0)drawCrate(o,z)}
  else if(o.hp>0){const p=proj(o.x,z);const w=W*.3*p.s,h=w*(o.k==='milk'?1.2:.8);drawBox(o,p,w,h,o.k==='milk');text(Math.ceil(o.hp),p.x,p.y-h/2,Math.max(10,28*p.s),'#fff')}}
 // yarn shots
 for(const s of shots){const z=s.p*s.tz,x=s.x+(s.tx-s.x)*s.p;const p=proj(x,z);const y=p.y-20*p.s-Math.sin(s.p*Math.PI)*40*p.s;ctx.fillStyle='hsl('+s.h+',80%,65%)';ctx.beginPath();ctx.arc(p.x,y,5*p.s,0,7);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.stroke()}
 drawCrowd();
 for(const p of pops){const q=proj(p.x,Math.max(0,p.z));text(p.txt,q.x,q.y-90*q.s-(1-p.t)*40,30,p.c)}
 // HUD
 if(surv){text(survT.toFixed(1)+'s / 60s',W/2,30,22,'#fff');text('Best: '+survBest.toFixed(1)+'s',W-60,30,14,'#fff')}else{text('Level '+(lvl+1)+'/5',W/2,30,22,'#fff');text('Best: '+best,W-50,30,14,'#fff')}
 drawPU();if(pu.shield>0){const q=proj(px,1.2);ctx.globalAlpha=.25+.1*Math.sin(anim*10);ctx.fillStyle='#7fc8ff';ctx.beginPath();ctx.ellipse(q.x,q.y-30*q.s,Math.max(60,Math.sqrt(Math.min(count,120))*11*q.s),70*q.s,0,0,7);ctx.fill();ctx.globalAlpha=1}
 const prog=surv?Math.min(1,survT/60):Math.min(1,dist/(L.len-8));ctx.fillStyle='rgba(0,0,0,.25)';rr(W*.2,50,W*.6,10,5);ctx.fill();ctx.fillStyle='#ffdc00';rr(W*.2,50,W*.6*prog,10,5);ctx.fill();
 if(st==='win'||st==='fail')drawEnd();
}
const MAXDRAW=120;
function drawCrowd(){const n=Math.max(0,Math.ceil(count)),show=Math.min(n,MAXDRAW);const pts=[];
 for(let i=0;i<show;i++){const r=Math.sqrt(i)*.055,a=i*2.39996;pts.push({x:px+Math.cos(a)*r*1.2,z:Math.sin(a)*r*2.2+1.2,i})}
 pts.sort((p,q)=>q.z-p.z);for(const c of pts){const p=proj(c.x,c.z);cat(p.x,p.y,p.s*1.5,FUR[c.i%FUR.length],anim*12+c.i)}
 const p=proj(px,1.2);const top=p.y-Math.sqrt(show)*14*p.s-60*p.s;ctx.fillStyle='rgba(0,0,0,.45)';rr(p.x-34,top-16,68,32,16);ctx.fill();text('🐱'+n,p.x,top,20,'#fff',false)}
function drawDog(z){const p=proj(0,z),w=W*.5*p.s,h=w*.9,x=p.x,y=p.y,bob=Math.sin(anim*9)*3*p.s,fl=dogFlash>0;const fur=fl?'#fff':'#a0673a',dk=fl?'#fdd':'#6b4226';
 ctx.lineWidth=3*p.s;ctx.strokeStyle='#333';
 for(let i=0;i<4;i++){const lx=x+(i-1.5)*w*.22,ph=Math.sin(anim*9+i*1.6)*5*p.s;ctx.fillStyle=dk;rr(lx-w*.06,y-h*.3+ph*.3,w*.12,h*.3,6*p.s);ctx.fill();ctx.stroke()}
 ctx.fillStyle=fur;ctx.beginPath();ctx.ellipse(x,y-h*.45+bob,w*.48,h*.28,0,0,7);ctx.fill();ctx.stroke();
 const hy=y-h*.82+bob;ctx.beginPath();ctx.arc(x,hy,w*.26,0,7);ctx.fill();ctx.stroke();
 ctx.fillStyle=dk;for(const s of[-1,1]){ctx.beginPath();ctx.ellipse(x+s*w*.27,hy+w*.02,w*.08,w*.18,s*.3,0,7);ctx.fill();ctx.stroke()}
 ctx.fillStyle='#f2d3a8';ctx.beginPath();ctx.ellipse(x,hy+w*.1,w*.14,w*.1,0,0,7);ctx.fill();
 ctx.fillStyle='#222';ctx.beginPath();ctx.ellipse(x,hy+w*.05,w*.05,w*.035,0,0,7);ctx.fill();
 for(const s of[-1,1]){ctx.beginPath();ctx.arc(x+s*w*.1,hy-w*.05,w*.03,0,7);ctx.fill();ctx.beginPath();ctx.moveTo(x+s*w*.17,hy-w*.15);ctx.lineTo(x+s*w*.04,hy-w*.09);ctx.stroke()}
 ctx.beginPath();ctx.arc(x,hy+w*.2,w*.06,Math.PI*1.15,Math.PI*1.85);ctx.stroke();
 if(dogZ-dist<=2.4){const a=Math.sin(swatA*12);ctx.fillStyle=fur;ctx.beginPath();ctx.ellipse(x+w*.45,y-h*.6-a*h*.2,w*.08,w*.12,a,0,7);ctx.fill();ctx.stroke();text('SWAT!',x+w*.45,y-h*.95,Math.max(12,22*p.s),'#ff4136')}
 const bw=Math.max(80,w*.9),by=y-h*1.2-14;ctx.fillStyle='rgba(0,0,0,.5)';rr(x-bw/2,by,bw,10,5);ctx.fill();ctx.fillStyle='#ff4136';rr(x-bw/2,by,bw*Math.max(0,bossHp/bossMax),10,5);ctx.fill();
 text('GRUMPY DOG  '+Math.ceil(bossHp),x,by-14,Math.max(12,18*p.s),'#ffdc00')}
function mouse(x,y,s,ph){const b=Math.abs(Math.sin(ph))*2*s;ctx.fillStyle='#9a9aa8';ctx.strokeStyle='#333';ctx.lineWidth=1*s;ctx.beginPath();ctx.ellipse(x,y-4*s-b,6*s,4*s,0,0,7);ctx.fill();ctx.stroke();
 ctx.fillStyle='#f7a8c4';ctx.beginPath();ctx.arc(x-3*s,y-9*s-b,2.2*s,0,7);ctx.arc(x+3*s,y-9*s-b,2.2*s,0,7);ctx.fill();ctx.fillStyle='#222';ctx.fillRect(x-2*s,y-5*s-b,1.2*s,1.2*s);ctx.fillRect(x+1*s,y-5*s-b,1.2*s,1.2*s)}
function drawMice(o,z){const show=Math.min(o.n,24);let top=1e9;for(let i=show-1;i>=0;i--){const mx=((i*0.618)%1-.5)*1.5,mz=z+(i%4)*.5;const p=proj(mx,mz);mouse(p.x,p.y,p.s*1.8,anim*14+i);top=Math.min(top,p.y)}
 const p=proj(0,z);ctx.fillStyle='rgba(0,0,0,.45)';rr(p.x-38,top-50*p.s-14,76,28,14);ctx.fill();text('🐭'+o.n,p.x,top-50*p.s,18,'#fff',false)}
function drawCrate(o,z){const p=proj(o.x,z),w=W*.22*p.s,h=w,x=p.x-w/2,y=p.y-h;ctx.fillStyle=PUC[o.k];rr(x,y,w,h,5*p.s);ctx.fill();ctx.strokeStyle='#333';ctx.lineWidth=2*p.s;ctx.stroke();
 ctx.strokeStyle='rgba(255,255,255,.6)';ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+w,y+h);ctx.moveTo(x+w,y);ctx.lineTo(x,y+h);ctx.stroke();
 text(PUI[o.k],p.x,y+h*.38,Math.max(10,30*p.s),'#fff',o.k==='plus');text(Math.ceil(o.hp),p.x,y+h*.78,Math.max(9,22*p.s),'#fff')}
function drawPart(q,z){const p=proj(q.x,Math.max(-2,z));if(q.k==='f'){const r=(1-q.t/.45)*22*p.s+6*p.s;ctx.globalAlpha=q.t/.45;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(p.x,p.y-q.h*p.s-r*.5,r,0,7);ctx.arc(p.x+r*.6,p.y-q.h*p.s-r*.2,r*.7,0,7);ctx.fill();ctx.globalAlpha=1;return}
 ctx.save();ctx.translate(p.x,p.y-q.h*p.s);ctx.rotate(q.r);ctx.fillStyle=q.c;const s=Math.max(2,7*p.s);ctx.fillRect(-s,-s*.6,s*2,s*1.2);ctx.restore()}
function drawPU(){let y=70;for(const k of['cannon','shield']){if(pu[k]>0){ctx.fillStyle='rgba(0,0,0,.45)';rr(10,y,120,30,15);ctx.fill();text(PUI[k],28,y+15,18,'#fff',false);ctx.fillStyle=PUC[k];rr(46,y+10,76*pu[k]/PUL[k],10,5);ctx.fill();y+=36}}}
function button(label,x,y,w,h,col,f){ctx.fillStyle=col;rr(x,y,w,h,h/2);ctx.fill();ctx.strokeStyle='#333';ctx.lineWidth=3;ctx.stroke();text(label,x+w/2,y+h/2,Math.min(26,h*.45),'#fff');buttons.push({x,y,w,h,f})}
function drawMenu(){buttons=[];text('CAT CROWD',W/2,H*.16,Math.min(56,W*.13),'#ffdc00');text('RUNNER',W/2,H*.16+Math.min(56,W*.13),Math.min(56,W*.13),'#ff85c0');
 for(let i=0;i<12;i++){const p=proj((i%4-1.5)*.25,2+(i/4|0)*.8);cat(p.x,p.y+H*.02,p.s*2.2,FUR[i%FUR.length],anim*8+i)}
 text('Drag left/right to pick gates.',W/2,H*.38,16,'#333',false);text('Grow your kitten crowd and yarn-bomb the boxes!',W/2,H*.38+22,14,'#333',false);
 const bw=Math.min(300,W*.75),Y=H*.5;button('PLAY  Level '+Math.min(5,best+1),W/2-bw/2,Y,bw,60,'#2ecc40',()=>startLevel(Math.min(4,best)));
 const sw=Math.min(52,(W-40)/5-8);for(let i=0;i<5;i++){const x=W/2-(5*sw+32)/2+i*(sw+8),un=i<=best;button(un?''+(i+1):'🔒',x,Y+75,sw,sw,un?'#4a90e2':'#999',un?()=>startLevel(i):()=>{})}
 button('Can you last 60 seconds?',W/2-bw/2,Y+75+sw+18,bw,46,'#ff851b',startSurvival);
 text('Best level cleared: '+best+'/5   ·   Best survival: '+survBest.toFixed(1)+'s',W/2,Y+75+sw+95,14,'#333',false)}
function drawEnd(){buttons=[];ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(0,0,W,H);const bw=Math.min(300,W*.75);
 if(surv){if(st==='win'){text('YOU LASTED 60 SECONDS!',W/2,H*.3,Math.min(34,W*.075),'#ffdc00');text(Math.ceil(count)+' kittens survived 🐾',W/2,H*.3+50,20,'#fff')}else{text('LASTED '+survT.toFixed(1)+'s',W/2,H*.3,Math.min(40,W*.08),'#ff4136');text(newBest?'New best time! 🎉':'Best: '+survBest.toFixed(1)+'s',W/2,H*.3+50,20,'#fff')}button('TRY AGAIN',W/2-bw/2,H*.5,bw,60,'#2ecc40',startSurvival)}
 else if(st==='win'){text(lvl===4?'ALL LEVELS CLEARED!':'LEVEL COMPLETE!',W/2,H*.3,Math.min(40,W*.08),'#ffdc00');text(Math.ceil(count)+' kittens made it 🐾',W/2,H*.3+50,20,'#fff');
  if(lvl<4)button('NEXT LEVEL',W/2-bw/2,H*.5,bw,60,'#2ecc40',()=>startLevel(lvl+1));button('REPLAY',W/2-bw/2,H*.5+75,bw,54,'#4a90e2',()=>startLevel(lvl))}
 else{text('OUT OF KITTENS!',W/2,H*.3,Math.min(40,W*.08),'#ff4136');text(lastHit||'Pick better gates and try again',W/2,H*.3+50,18,'#fff');button('TRY AGAIN',W/2-bw/2,H*.5,bw,60,'#2ecc40',()=>startLevel(lvl))}
 button('MENU',W/2-bw/2,H*.5+150,bw,50,'#999',()=>{st='menu'})}
function loop(t){const dt=Math.min(.05,(t-lastT)/1000||0);lastT=t;update(dt);render();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script></body></html>
